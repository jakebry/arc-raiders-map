<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Raiders — Keycard Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/styles.css?v=30">
</head>
<body>

    <!-- Screen 1: Map Selection (Event-based home screen) -->
    <div id="screen-select" class="screen active">
        <div class="events-home">
            <!-- Header -->
            <header class="events-header">
                <div class="events-header-left">
                    <h1>ARC RAIDERS</h1>
                    <p class="subtitle">KEYCARD MAP</p>
                </div>
                <p class="disclaimer">Not affiliated with Embark. Fan-made content.</p>
            </header>

            <!-- Main content: map + side panel -->
            <div class="events-content">
                <!-- Overhead map with nodes -->
                <div class="events-map-area">
                    <div class="events-map-container" id="events-map-container">
                        <img src="images/map-selection-bg.png" alt="Map Overview" class="events-map-bg">
                        <div id="map-nodes"></div>
                    </div>
                </div>

                <!-- Side panel: event card -->
                <div class="events-side-panel" id="events-side-panel">
                    <div class="event-card" id="event-card">
                        <div class="event-card-image-wrap">
                            <img id="event-card-image" class="event-card-image" src="" alt="Event">
                            <div class="event-card-multiplier" id="event-card-multiplier">2X</div>
                        </div>
                        <div class="event-card-body">
                            <div class="event-card-map-name" id="event-card-map-name">—</div>
                            <div class="event-card-event-name" id="event-card-event-name">No Active Event</div>
                            <div class="event-card-description" id="event-card-description">Select a map to view current event details.</div>
                            <div class="event-card-modifiers" id="event-card-modifiers"></div>
                            <div class="event-card-meta">
                                <div class="event-card-difficulty" id="event-card-difficulty">
                                    <span class="difficulty-label">DIFFICULTY</span>
                                    <span class="difficulty-pips" id="difficulty-pips"></span>
                                </div>
                                <div class="event-card-timer" id="event-card-timer">
                                    <span class="timer-label" id="timer-label">ENDS IN</span>
                                    <span class="timer-value" id="timer-value">—</span>
                                </div>
                            </div>
                            <button class="event-card-inspect-btn" id="event-card-inspect-btn">INSPECT MAP</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer credit -->
            <footer class="events-footer">
                <span>Event data provided by <a href="https://metaforge.app" target="_blank" rel="noopener">MetaForge</a></span>
            </footer>
        </div>

        <!-- Hidden fallback grid (kept for renderMapCards compatibility) -->
        <div id="map-cards" class="map-grid" style="display:none;"></div>
    </div>

    <!-- Screen 2: Interactive Map -->
    <div id="screen-map" class="screen">
        <div id="map-ui-overlay">
            <button id="btn-back" class="btn-back">← BACK</button>
            <div id="level-toggle" class="level-toggle"></div>
        </div>
        <div id="map-container">
            <div id="leaflet-map"></div>
            <div id="custom-zoom" class="custom-zoom">
                <button class="zoom-btn zoom-in">+</button>
                <input type="range" id="zoom-slider" class="zoom-slider" orient="vertical" min="-5" max="3" step="0.01" value="0">
                <button class="zoom-btn zoom-out">−</button>
            </div>
        </div>
        <div id="inventory-bar" class="inventory-bar">
            <div id="inventory-slots" class="inventory-slots"></div>
        </div>
    </div>

    <script src="js/data.js?v=30"></script>
    <script src="js/app.js?v=30"></script>
    <script src="js/events.js?v=30"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
